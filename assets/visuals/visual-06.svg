<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <rect width="1200" height="900" fill="#111111"/>
  <text x="70" y="100" font-family="Courier New, monospace" font-size="20" fill="#FF4D1F">TYPE SPECIMEN — 01 / SERIF DISPLAY</text>
  <text x="50" y="640" font-family="Georgia, serif" font-size="500" fill="#F4F1EA">Aa</text>
  <rect x="660" y="160" width="1.5" height="600" fill="#333"/>
  <g font-family="Georgia, serif" fill="#F4F1EA" font-size="40">
    <text x="710" y="230">ABCDEFGHIJKLM</text>
    <text x="710" y="285">NOPQRSTUVWXYZ</text>
    <text x="710" y="350" font-style="italic">abcdefghijklm</text>
    <text x="710" y="405" font-style="italic">nopqrstuvwxyz</text>
    <text x="710" y="470">0123456789 &amp;?!</text>
  </g>
  <g font-family="Arial, sans-serif" fill="#8a8780" font-size="16" letter-spacing="3">
    <text x="710" y="560">REGULAR</text><text x="850" y="560">ITALIC</text><text x="970" y="560">BOLD</text>
  </g>
  <g font-family="Georgia, serif" fill="#F4F1EA" font-size="56">
    <text x="710" y="630">Rg</text><text x="850" y="630" font-style="italic">It</text><text x="970" y="630" font-weight="700">Bd</text>
  </g>
  <circle cx="725" cy="720" r="16" fill="#FF4D1F"/><circle cx="770" cy="720" r="16" fill="#F4F1EA"/><circle cx="815" cy="720" r="16" fill="#555"/>
  <text x="70" y="830" font-family="Georgia, serif" font-style="italic" font-size="30" fill="#8a8780">“Typography is what language looks like.”</text>
</svg>
